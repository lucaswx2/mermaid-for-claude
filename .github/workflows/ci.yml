name: ci

on:
  push:
  pull_request:

# npm ci and npm run build execute dependency lifecycle scripts, so this job floors its
# token at read even though the repo default is already read: a settings flip must not
# silently hand it write access.
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: dist matches the source, new files included
        run: git add --intent-to-add dist && git diff --exit-code -- dist/
        shell: bash
      - run: npm run typecheck
      - run: npm test
